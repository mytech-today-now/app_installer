name: Publish Versioned Unsigned Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: app-installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_release_tag:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Require a protected semantic-version tag
        shell: powershell
        env:
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -cne 'tag') {
              throw 'The release workflow requires a tag ref.'
          }
          if ($env:RELEASE_REF_PROTECTED -cne 'true') {
              throw 'The release tag must be protected by a GitHub ruleset or tag protection rule.'
          }

      - name: Require a fresh compatibility source review
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\tools\Test-CompatibilityReview.ps1 -RequireFresh
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Validate tag against VERSION and script metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
          & $pwsh -NoProfile -File .\tools\Test-InstallerReleaseTag.ps1 -TagName $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

  compatibility:
    needs: validate_release_tag
    if: ${{ github.event.repository.private == false }}
    uses: ./.github/workflows/windows-build-compatibility.yml
    with:
      validate_release_tag: true

  supported_client_gui_evidence:
    name: Validate supported Windows client GUI evidence
    needs: validate_release_tag
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the manual evidence record from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: client-evidence
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Require complete evidence for both supported client engines
        shell: powershell
        env:
          RELEASE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name .\modules\InstallerClientGuiReleaseEvidence.psm1 -Force -DisableNameChecking -ErrorAction Stop
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'client-evidence\WINDOWS_CLIENT_GUI_RELEASE_EVIDENCE.json'
          $result = Test-InstallerClientGuiReleaseEvidence -EvidencePath $evidencePath -SourceRevision $env:RELEASE_SOURCE_REVISION -CompatibilityPath (Join-Path $env:GITHUB_WORKSPACE 'compatibility.json')
          if (-not $result.IsReady) {
              foreach ($message in $result.Errors) {
                  Write-Host ('::error::{0}' -f $message)
              }
              exit 1
          }

          $desktop = $result.Record.engines.'Desktop-5.1'
          $core = $result.Record.engines.'Core-7.6.9'
          $summaryLines = @(
              '## Supported Windows client GUI evidence gate'
              ('- Release source revision: {0}.' -f $result.SourceRevision)
              ('- Windows PowerShell Desktop 5.1: capability {0}, isolated startup {1}, recorded {2}; evidence {3}.' -f $desktop.capabilityResult, $desktop.isolatedStartupResult, $desktop.recordedAtUtc, $desktop.evidenceLocation)
              ('- PowerShell Core 7.6.9: capability {0}, isolated startup {1}, recorded {2}; evidence {3}.' -f $core.capabilityResult, $core.isolatedStartupResult, $core.recordedAtUtc, $core.evidenceLocation)
              '- Gate runner: Windows Server 2025. It validated the manual record and did not run client GUI checks.'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summaryLines -join [Environment]::NewLine)

  release_protection_readiness:
    name: Validate remote release protection record
    needs: validate_release_tag
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the release protection record from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-protection
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Require current, complete remote settings evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name .\modules\InstallerReleaseProtectionReadiness.psm1 -Force -DisableNameChecking -ErrorAction Stop
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'release-protection'
          $recordPath = Join-Path $evidenceRoot 'RELEASE_PROTECTION_VERIFICATION.json'
          $result = Test-InstallerReleaseProtectionReadiness -VerificationPath $recordPath -EvidenceRoot $evidenceRoot
          if (-not $result.IsReady) {
              foreach ($message in $result.Errors) {
                  Write-Host ('::error::{0}' -f $message)
              }
              exit 1
          }

          $activeTagRulesetCount = @($result.Record.settings.rulesets | Where-Object { $_.target -ceq 'tag' -and $_.enforcement -ceq 'active' }).Count
          $summaryLines = @(
              '## Remote release protection readiness gate'
              ('- Repository: {0}.' -f $result.Record.repository)
              ('- Settings observed at (UTC): {0}.' -f $result.Record.observedAtUtc)
              ('- Durable evidence: {0} (SHA-256 verified).' -f $result.Record.evidence.location)
              ('- Active tag rulesets observed: {0}.' -f $activeTagRulesetCount)
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summaryLines -join [Environment]::NewLine)

  publish_release:
    needs:
      - validate_release_tag
      - compatibility
      - supported_client_gui_evidence
      - release_protection_readiness
    if: ${{ github.event.repository.private == false && needs.validate_release_tag.result == 'success' && needs.compatibility.result == 'success' && needs.supported_client_gui_evidence.result == 'success' && needs.release_protection_readiness.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the validated tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Build, prepare, and publish the validated release
        shell: powershell
        env:
          RELEASE_API_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_WORKFLOW_NAME: ${{ github.workflow }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
          $actualPowerShell = [string]::Join('', @(& $pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualPowerShell -cne '7.6.9') {
              throw ('PowerShell Core 7.6.9 is required for release packaging; found {0}.' -f $actualPowerShell)
          }

          & $pwsh -NoProfile -File .\tools\Test-InstallerReleaseTag.ps1 -TagName $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          & $pwsh -NoProfile -File .\tools\Build-InstallerExe.ps1 -Confirm:$false
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $assetDirectory = Join-Path $env:RUNNER_TEMP ('app-installer-release-' + $env:RELEASE_RUN_ID)
          & $pwsh -NoProfile -File .\tools\New-InstallerReleaseAssets.ps1 `
              -RepositoryRoot . `
              -TagName $env:RELEASE_TAG `
              -SourceCommit $env:RELEASE_SOURCE_COMMIT `
              -DefaultBranch $env:RELEASE_DEFAULT_BRANCH `
              -WorkflowName $env:RELEASE_WORKFLOW_NAME `
              -RunId $env:RELEASE_RUN_ID `
              -PassedEnginesCsv 'Desktop-5.1,Core-7.6.9' `
              -OutputDirectory $assetDirectory
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          & $pwsh -NoProfile -File .\tools\Publish-InstallerRelease.ps1 `
              -RepositoryRoot . `
              -Repository $env:RELEASE_REPOSITORY `
              -TagName $env:RELEASE_TAG `
              -SourceCommit $env:RELEASE_SOURCE_COMMIT `
              -DefaultBranch $env:RELEASE_DEFAULT_BRANCH `
              -AssetsDirectory $assetDirectory
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
